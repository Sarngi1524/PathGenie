services:

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pathgenie-server
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: http://localhost
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pathgenie-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped